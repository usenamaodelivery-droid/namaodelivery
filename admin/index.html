<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · Delivery NaMão</title>
  <meta name="description" content="Painel administrativo Delivery NaMão" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Tailwind CSS via CDN (mantém stack do PWA, leve, sem build) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
    // Tailwind theme: cores e tipografia consistentes com PWA / driver
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: "#0F172A", soft: "#1E293B" },
            accent:  { DEFAULT: "#22C55E", dark: "#16A34A" },
            warn:    "#F59E0B",
            danger:  "#EF4444",
          },
          fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
          boxShadow:  { card: "0 4px 18px -4px rgba(15,23,42,0.08)" },
        },
      },
    };
  </script>

  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .nav-item.active { background: #F1F5F9; color: #0F172A; }
    .nav-item.active i { color: #22C55E; }
    .table-row:hover { background: #F8FAFC; }
    .badge { padding: 2px 8px; border-radius: 9999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-green  { background: #DCFCE7; color: #166534; }
    .badge-yellow { background: #FEF3C7; color: #92400E; }
    .badge-red    { background: #FEE2E2; color: #991B1B; }
    .badge-blue   { background: #DBEAFE; color: #1E40AF; }
    .badge-gray   { background: #F1F5F9; color: #475569; }
    .toast { transition: opacity 0.3s, transform 0.3s; }
    /* Scrollbar fina */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="bg-slate-50 text-primary">

  <!-- ========================= LOGIN ========================= -->
  <div id="login-screen" class="fixed inset-0 bg-gradient-to-br from-primary to-primary-soft text-white flex items-center justify-center z-50">
    <div class="w-full max-w-sm p-6">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto bg-accent rounded-2xl flex items-center justify-center mb-4">
          <i class="fa-solid fa-shield-halved text-3xl text-white"></i>
        </div>
        <h1 class="text-3xl font-black">Admin Delivery NaMão</h1>
        <p class="text-slate-300 mt-1">Painel de controle</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="text-xs font-bold text-slate-300 uppercase">Email</label>
          <input id="login-email" type="email" required autocomplete="email"
                 class="mt-1 w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <div>
          <label class="text-xs font-bold text-slate-300 uppercase">Senha</label>
          <input id="login-password" type="password" required autocomplete="current-password"
                 class="mt-1 w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-accent" />
        </div>
        <button type="submit" id="login-button"
                class="w-full py-3 bg-accent text-white font-black rounded-xl hover:bg-accent-dark active:scale-[0.98] transition">
          Entrar
        </button>
        <p id="login-error" class="text-danger text-sm text-center hidden"></p>
      </form>
    </div>
  </div>

  <!-- ========================= DASHBOARD SHELL ========================= -->
  <div id="app-shell" class="hidden h-screen flex">

    <!-- Sidebar -->
    <aside class="w-60 bg-white border-r border-slate-200 flex flex-col">
      <div class="p-5 border-b border-slate-100">
        <div class="flex items-center gap-2">
          <div class="w-9 h-9 bg-accent rounded-xl flex items-center justify-center">
            <i class="fa-solid fa-bolt text-white"></i>
          </div>
          <div>
            <p class="font-black text-sm leading-tight">NaMão</p>
            <p class="text-tiny text-slate-500">Admin Panel</p>
          </div>
        </div>
      </div>

      <nav id="sidebar-nav" class="flex-1 py-3 px-2 space-y-0.5 overflow-y-auto">
        <a href="#dashboard" data-route="dashboard" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-chart-line w-5 text-slate-400"></i> Resumo
        </a>
        <a href="#drivers" data-route="drivers" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-motorcycle w-5 text-slate-400"></i> Motoristas
        </a>
        <a href="#orders" data-route="orders" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-box w-5 text-slate-400"></i> Pedidos
        </a>
        <a href="#finance" data-route="finance" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-sack-dollar w-5 text-slate-400"></i> Financeiro
        </a>
        <a href="#payouts" data-route="payouts" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-money-bill-transfer w-5 text-slate-400"></i> Repasses PIX
        </a>
        <a href="#blocks" data-route="blocks" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-ban w-5 text-slate-400"></i> Bloqueios
        </a>
        <a href="#broadcast" data-route="broadcast" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-bullhorn w-5 text-slate-400"></i> Comunicados
        </a>
        <a href="#security" data-route="security" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-shield-halved w-5 text-slate-400"></i> Segurança
        </a>
        <a href="#config" data-route="config" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-bold text-slate-600 hover:bg-slate-100">
          <i class="fa-solid fa-gear w-5 text-slate-400"></i> Configurações
        </a>
      </nav>

      <div class="p-3 border-t border-slate-100 text-xs">
        <div id="user-info" class="px-2 mb-2 text-slate-500 truncate"></div>
        <button id="logout-button" class="w-full py-2 text-slate-600 font-bold hover:bg-slate-100 rounded-lg flex items-center justify-center gap-2">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>
    </aside>

    <!-- Main content area -->
    <main id="main-area" class="flex-1 overflow-y-auto">
      <div id="page-header" class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between sticky top-0 z-10">
        <div>
          <h1 id="page-title" class="text-xl font-black">Resumo</h1>
          <p id="page-subtitle" class="text-sm text-slate-500"></p>
        </div>
        <div class="flex items-center gap-3">
          <span id="refresh-indicator" class="text-xs text-slate-500 font-medium hidden md:inline-flex items-center gap-1"></span>
          <div id="page-actions" class="flex items-center gap-2"></div>
        </div>
      </div>

      <div id="page-content" class="p-6"></div>
    </main>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 px-4 py-3 bg-primary text-white font-bold rounded-xl shadow-card hidden opacity-0 toast" style="z-index: 9999;"></div>

  <!-- Modal generic -->
  <div id="modal-root" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center" style="z-index: 5000;" onclick="if(event.target===this){window.adminApp?.closeModal()}">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-[92%] max-h-[88vh] overflow-y-auto"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
